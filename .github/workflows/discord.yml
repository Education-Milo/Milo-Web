name: 🎮 Discord Notification

on:
  push:
    branches:
      - main

jobs:
  notify:
    name: 🔔 Notification Discord
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📊 Récupération des informations
        id: commit_info
        run: |
          echo "commit_message=$(git log -1 --pretty=format:'%s' | tr '\n' ' ')" >> $GITHUB_OUTPUT
          echo "commit_author=$(git log -1 --pretty=format:'%an')" >> $GITHUB_OUTPUT
          echo "files_changed=$(git diff --name-only HEAD~1 HEAD | wc -l)" >> $GITHUB_OUTPUT

      - name: 🔔 Message discord
        uses: appleboy/discord-action@master
        with:
          webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
          webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          color: "#00D4AA"
          username: "🤖 GitHub Bot"
          message: "🚀 Nouveau push par ${{ steps.commit_info.outputs.commit_author }} - ${{ steps.commit_info.outputs.commit_message }} - ${{ steps.commit_info.outputs.files_changed }} fichiers modifiés"
